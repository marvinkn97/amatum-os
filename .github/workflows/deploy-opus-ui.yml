name: Deploy Opus UI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'opus-ui/**'
      - '.github/workflows/deploy-opus-ui.yml'
      - '.github/workflows/angular-template.yml'

jobs:
  call-workflow:
    uses: ./.github/workflows/angular-template.yml
    with:
      project-name: 'opus-ui'
      project-path: 'opus-ui'
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}