name:  Spring Boot App Build and Deploy Pipeline

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      service-path:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME: {required: true}
      DOCKERHUB_TOKEN: {required: true}
      SERVER_IP: {required: true}
      SERVER_USER: {required: true}
      SSH_PRIVATE_KEY: {required: true}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Push with Jib
        run: |
          cd ${{ inputs.service-path }}
          ./mvnw compile jib:build \
            -Dimage=${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service-name }} \
            -Djib.to.tags=latest,${{ env.short_sha }} \
            -Djib.to.auth.username=${{ secrets.DOCKERHUB_USERNAME }} \
            -Djib.to.auth.password=${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/projects/amatum-os
            docker compose pull ${{ inputs.service-name }}
            docker compose up -d --no-deps ${{ inputs.service-name }}