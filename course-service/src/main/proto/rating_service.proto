syntax = "proto3";

package rating;

option java_multiple_files = true;
option java_package = "dev.marvin.rating.proto";
option java_outer_classname = "RatingProto";

service RatingService {
  rpc GetBulkAverageRatings (BulkRatingRequest) returns (BulkRatingResponse);
}

message BulkRatingRequest {
  repeated string course_ids = 1;
}

message CourseRating {
  string course_id = 1;
  double average_rating = 2;
}

message BulkRatingResponse {
  repeated CourseRating ratings = 1;
}