services:
  #  KEYCLOAK:
  amatum-postgres-keycloak:
    image: postgres:latest
    container_name: amatum-postgres-keycloak
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql/data
    networks:
      - amatum-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak -d keycloak_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    pull_policy: always
    container_name: amatum-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: password
      KC_DB: postgres
      KC_DB_URL_HOST: amatum-postgres-keycloak
      KC_DB_URL_DATABASE: keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_HEALTH_ENABLED: "false"
    command: start-dev
    ports:
      - "9000:8080"
    depends_on:
      amatum-postgres-keycloak:
        condition: service_healthy
    volumes:
      - keycloak-data:/opt/keycloak/data
    networks:
      - amatum-network

  identity-db:
    image: postgres:latest
    container_name: identity-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: identity_db
    ports:
      - "54321:5432" # maps local 5433 -> container 5432
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    networks:
      - amatum-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d identity_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  course-db:
    image: postgres:latest
    container_name: course-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: course_db
    ports:
      - "54322:5432"
    networks:
      - amatum-network
    volumes:
      - course-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d course_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  enrollment-db:
    image: postgres:latest
    container_name: enrollment-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: enrollment_db
    ports:
      - "54323:5432"
    networks:
      - amatum-network
    volumes:
      - enrollment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d enrollment_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  rating-db:
    image: postgres:latest
    container_name: rating-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rating_db
    ports:
      - "54324:5432"
    networks:
      - amatum-network
    volumes:
      - rating-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d rating_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4:7
    container_name: amatum-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@amatum.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "5050:80"
    networks:
      - amatum-network
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    container_name: amatum-rustfs
    ports:
      - "9010:9000" # API
      - "9011:9001" # Console
    environment:
      - RUSTFS_ROOT_USER=admin
      - RUSTFS_ROOT_PASSWORD=password
    networks:
      - amatum-network
    volumes:
      - rustfs-data:/data


  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: amatum-gotenberg
    # We don't necessarily need to expose ports to the host if only Spring Boot uses it,
    # but 3000 is useful for local testing.
    ports:
      - "3000:3000"
    networks:
      - amatum-network
    restart: unless-stopped
    # Gotenberg is very light on idle but needs resources during PDF generation
    deploy:
      resources:
        limits:
          memory: 512M

  kafka:
    image: apache/kafka-native:3.8.0
    container_name: amatum-kafka
    ports:
      - "29092:29092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    networks:
      - amatum-network
    volumes:
      - ./kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # MODERN UI CLIENT (Kafka UI)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: amatum-kafka-ui
    ports:
      - "8088:8080" # Access UI at http://localhost:8088
    environment:
      - KAFKA_CLUSTERS_0_NAME=amatum-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092 # Uses INTERNAL listener
      - DYNAMIC_CONFIG_ENABLED=true
    networks:
      - amatum-network
    depends_on:
      - kafka

  # NEW: Dedicated Vector Store Database for AI Operations (RAG, Embeddings)
  ai-db:
    image: ankane/pgvector:latest
    container_name: amatum-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_vector_db
    ports:
      - "54325:5432" # Maps local 54325 -> container 5432
    networks:
      - amatum-network
    volumes:
      - ai-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ai_vector_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # NEW: Ollama Inference Engine
  ollama:
    image: ollama/ollama:latest
    container_name: amatum-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - amatum-network
    restart: unless-stopped
    healthcheck:
      # MODIFIED: Swapped out curl for the native ollama CLI check
      test: [ "CMD", "ollama", "list" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
        limits:
          memory: 6G
          cpus: '4.0'

  # NEW: Automated Sidecar Provisioner to handle the initial pull
  ollama-provisioner:
    image: curlimages/curl:latest
    container_name: amatum-ollama-provisioner
    networks:
      - amatum-network
    depends_on:
      ollama:
        condition: service_healthy
    command: >
      curl -X POST http://ollama:11434/api/pull -d '{"name": "mistral"}'

volumes:
  keycloak-data:
  postgres-keycloak-data:
  identity-db-data:
  course-db-data:
  pgadmin-data:
  rustfs-data:
  enrollment-db-data:
  rating-db-data:
  kafka-data:
  ai-db-data:
  ollama-models:


networks:
  amatum-network:
    driver: bridge