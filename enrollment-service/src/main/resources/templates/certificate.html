<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @page {
            size: landscape;
            margin: 0;
        }

        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100% !important;
            width: 100% !important;
            /* Premium Off-White/Pearl */
            background-color: #FDFCFB !important;
            color: #1E293B !important;
            overflow: hidden;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* Card with subtle contrast against the pearl background */
        .cert-card {
            background-color: #ffffff !important;
            border: 1px solid #E2E8F0 !important;
            z-index: 10;
        }

        .inner-border {
            border: 1px solid #F1F5F9;
        }
    </style>
    <title>Certificate of Completion</title>
</head>
<body class="antialiased">

<div class="main-container h-full w-full flex items-center justify-center relative">

    <div class="cert-card relative w-[92%] max-w-[1100px] h-[88%] max-h-[760px] rounded-[3.5rem] flex flex-col items-center justify-between py-16 px-12 shadow-xl">

        <!-- Ornamental Inner Border -->
        <div class="inner-border absolute inset-4 rounded-[3rem] pointer-events-none"></div>

        <!-- Header Section with Indigo Logo -->
        <div class="flex flex-col items-center gap-4">
            <div class="size-20 relative flex items-center justify-center">
                <!-- Restored Indigo Gradient Logo -->
                <div class="relative size-16 bg-gradient-to-br from-indigo-500 to-indigo-700 rounded-2xl rotate-45 flex items-center justify-center border border-indigo-400/30 shadow-lg shadow-indigo-500/10">
                    <div class="size-12 border border-white/20 rounded-xl flex items-center justify-center -rotate-45">
                        <svg class="size-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </div>
                </div>
            </div>
            <p class="text-[10px] font-black uppercase tracking-[0.6em] text-indigo-500">
                Official Certification
            </p>
        </div>

        <!-- Content Section -->
        <div class="flex flex-col items-center gap-8 text-center">
            <div class="space-y-4">
                <p class="text-[11px] font-bold text-slate-400 uppercase tracking-[0.4em]">
                    This certificate is proudly presented to
                </p>
                <h1 class="text-xl font-black text-slate-800 tracking-tighter uppercase leading-tight">
                    {{learnerName}}
                </h1>
            </div>

            <!-- Indigo Accent Divider -->
            <div class="flex items-center gap-6 w-full justify-center">
                <div class="h-px w-16 bg-indigo-100"></div>
                <div class="size-2 rounded-full bg-indigo-500"></div>
                <div class="h-px w-16 bg-indigo-100"></div>
            </div>

            <div class="space-y-4">
                <p class="text-[11px] font-medium text-slate-400 uppercase tracking-[0.4em]">
                    For successfully completing the course
                </p>
                <h2 class="text-xl text-slate-600 tracking-tight uppercase leading-tight">
                    {{courseTitle}}
                </h2>
            </div>
        </div>

        <!-- Footer Metadata -->
        <div class="w-full flex justify-between items-end px-10">
            <div class="text-left">
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Issue Date</p>
                <p class="text-xs font-bold text-slate-600 uppercase tracking-tight">{{issuedDate}}</p>
            </div>

            <div class="text-center">
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Issued By</p>
                <!-- Company name now matches the Date style (Sans-serif, Bold) -->
                <p class="text-xs font-bold text-slate-600 uppercase tracking-tight">{{companyName}}</p>
            </div>

            <div class="text-right">
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Cert ID</p>
                <p class="text-xs font-bold text-slate-600 tracking-tight">{{certId}}</p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
