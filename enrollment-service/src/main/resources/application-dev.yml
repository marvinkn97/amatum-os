server:
  port: 8083

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:54323/enrollment_db
    username: postgres
    password: password

  jpa:
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000/realms/amatum

  grpc:
    server:
      enabled: true
      port: 9093
    client:
      course-service:
        address: localhost
        port: 9092
      identity-service:
        address: localhost
        port: 9091

keycloak:
  clients:
    lumina-client-id: lms-ui
    opus-client-id: opus-ui

gotenberg:
  url: http://localhost:3000

app:
  domain:
    quiz-attempt:
      passmark: 50

storage:
  rustfs:
    endpoint: ${RUSTFS_ENDPOINT:http://localhost:9010}
    region: ${RUSTFS_REGION:us-east-1}
    bucket: ${RUSTFS_BUCKET:amatum}
    access-key: ${RUSTFS_ACCESS_KEY}
    secret-key: ${RUSTFS_SECRET_KEY}